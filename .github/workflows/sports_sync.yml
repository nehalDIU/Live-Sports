name: Live Sports Auto-Sync & Database Update

on:
  schedule:
    # Runs every 20 minutes
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-live-sports:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch from Main Source & Update Database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_SECRET_TOKEN: ${{ secrets.ADMIN_SECRET_TOKEN }}
          CATEGORY_ID: ${{ vars.CATEGORY_ID || 'events' }}
          SPORTS_JSON_URL: 'https://raw.githubusercontent.com/srhady/axsports/main/live_sports.json'
        run: |
          python main.py --sync-db

      - name: Commit and push updated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json channels.json playlist.m3u last_hash_sports_events.txt
          if ! git diff --staged --quiet; then
            git commit -m "auto: update live sports data & playlist [skip ci]"
            git push
          else
            echo "No file changes detected."
          fi
